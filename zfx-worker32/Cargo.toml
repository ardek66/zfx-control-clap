[package]
name = "zfx-worker32"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "2.4"
goblin = "0.8"
libc = "0.2"
once_cell = "1.19"
zerocopy = { version = "0.8", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
# Catches unconsumed lazy iterators entirely
unused_must_use = "deny"

[workspace.lints.clippy]
# Baseline hygiene: Elevate pedantic and nursery suites to warn for baseline modern Rust idioms
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Loop Habits: Deny C-style index loops, raw pointer iteration, and manual buffer copying
needless_range_loop = "deny"
manual_memcpy = "deny"
explicit_iter_loop = "deny"
explicit_into_iter_loop = "deny"
while_let_on_iterator = "deny"
iter_next_loop = "deny"
never_loop = "deny"
manual_find = "warn"
manual_filter_map = "deny"
manual_flatten = "warn"
iter_skip_next = "deny"
filter_next = "deny"
search_is_some = "deny"

# Pointer & Cast Clutter: Hunt down raw pointer math, truncating casts, and unsafe pointer alignments
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
cast_ptr_alignment = "deny"
ptr_as_ptr = "deny"
ptr_offset_with_cast = "deny"
transmute_ptr_to_ptr = "deny"
transmutes_expressible_as_ptr_casts = "deny"
fn_to_numeric_cast = "deny"
fn_to_numeric_cast_with_truncation = "deny"
char_lit_as_u8 = "deny"
undocumented_unsafe_blocks = "deny"

# Memory & Copy Overhead: Prevent C++ pass-by-value semantics, redundant clones, and pseudo-memcpy copies
redundant_clone = "deny"
clone_on_copy = "deny"
clone_on_ref_ptr = "deny"
cloned_instead_of_copied = "deny"
unnecessary_to_owned = "deny"
needless_pass_by_value = "deny"
large_types_passed_by_value = "deny"
trivially_copy_pass_by_ref = "deny"

# Logical Complexity & Control Flow: Flatten nested if/else ladders, enforce match on branching IDs
cognitive_complexity = "deny"
collapsible_if = "deny"
collapsible_else_if = "deny"
collapsible_match = "deny"
comparison_chain = "deny"
manual_let_else = "deny"
manual_range_contains = "deny"
match_same_arms = "deny"
match_bool = "deny"
needless_bool = "deny"
redundant_pattern_matching = "deny"
single_match_else = "deny"
too_many_arguments = "deny"
too_many_lines = "warn"

# Idiomatic Rust & Code Hygiene Hardening:
needless_late_init = "deny"
redundant_else = "deny"
match_like_matches_macro = "deny"
manual_is_ascii_check = "deny"
manual_string_new = "deny"
manual_unwrap_or_default = "deny"
manual_map = "deny"
manual_assert = "deny"
manual_clamp = "deny"
manual_instant_elapsed = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
ref_as_ptr = "deny"
mut_mut = "deny"
unnecessary_mut_passed = "deny"
unnecessary_cast = "deny"
zero_ptr = "deny"
iter_filter_is_ok = "deny"
iter_filter_is_some = "deny"
semicolon_if_nothing_returned = "deny"
useless_let_if_seq = "deny"
redundant_guards = "deny"
match_wildcard_for_single_variants = "deny"
flat_map_option = "deny"
filter_map_bool_then = "deny"
useless_asref = "deny"

