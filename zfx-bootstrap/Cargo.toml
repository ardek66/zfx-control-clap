[package]
name = "zfx-bootstrap"
version = "0.1.0"
edition = "2021"
description = "Universal CLAP bootstrap template for ZFX plugins"

# -----------------------------------------------------------------------
# Optional feature flags
#
#   feat_oversampling  — Enables the host-rate resampler, the 1x/2x/4x
#                        oversampling quality badge in the GUI, and the
#                        state-format v2 extension that persists the mode.
#                        Off by default so the default build is a 1:1
#                        reproduction of the original Zoom ZFX behaviour.
#
#   feat_mic_ui        — Enables the custom studio-microphone egui panel
#                        rendered for "mic"-category plugins (condensers,
#                        dynamic mics, etc.).  Off by default; those plugins
#                        fall through to the standard parameter knob layout.
# -----------------------------------------------------------------------
[features]
feat_oversampling = []
feat_mic_ui = []

[lib]
crate-type = ["cdylib"]

[dependencies]
baseview = "0.4.0"
bitflags = "2.4"
clack-extensions = { version = "0.2.0", features = ["gui", "params", "audio-ports", "state", "latency", "clack-plugin"] }
clack-plugin = "0.2"
clack-common = "0.2"
egui = "0.36.2"
egui-baseview = "0.8.0"
egui_extras = { version = "0.36.2", features = ["image"] }
goblin = "0.8"
image = "0.25.10"
libc = "0.2"
once_cell = "1.19"
quick-xml = { version = "0.42.0", features = ["serialize"] }
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
zerocopy = { version = "0.8", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_JobObjects",
    "Win32_Security",
] }

[patch.crates-io]
baseview = { path = "vendor/baseview" }

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
# Catches unconsumed lazy iterators entirely
unused_must_use = "deny"

[workspace.lints.clippy]
# Baseline hygiene: Elevate pedantic and nursery suites to warn for baseline modern Rust idioms
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Loop Habits: Deny C-style index loops, raw pointer iteration, and manual buffer copying
needless_range_loop = "deny"
manual_memcpy = "deny"
explicit_iter_loop = "deny"
explicit_into_iter_loop = "deny"
while_let_on_iterator = "deny"
iter_next_loop = "deny"
never_loop = "deny"
manual_find = "warn"
manual_filter_map = "warn"
manual_flatten = "warn"
iter_skip_next = "deny"
filter_next = "deny"
search_is_some = "deny"

# Pointer & Cast Clutter: Hunt down raw pointer math, C-style `as` coercion, and truncating casts
as_conversions = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
cast_ptr_alignment = "deny"
ptr_as_ptr = "deny"
ptr_offset_with_cast = "deny"
transmute_ptr_to_ptr = "deny"
transmutes_expressible_as_ptr_casts = "deny"
fn_to_numeric_cast = "deny"
fn_to_numeric_cast_with_truncation = "deny"
char_lit_as_u8 = "deny"
undocumented_unsafe_blocks = "deny"

# Memory & Copy Overhead: Prevent C++ pass-by-value semantics, redundant clones, and pseudo-memcpy copies
redundant_clone = "deny"
clone_on_copy = "deny"
clone_on_ref_ptr = "deny"
cloned_instead_of_copied = "deny"
unnecessary_to_owned = "deny"
needless_pass_by_value = "deny"
large_types_passed_by_value = "deny"
trivially_copy_pass_by_ref = "deny"

# Logical Complexity: Flatten nested if/else ladders, eliminate manual range checks, and limit function sprawl
cognitive_complexity = "deny"
collapsible_if = "deny"
collapsible_else_if = "deny"
manual_range_contains = "deny"
match_same_arms = "deny"
match_bool = "deny"
needless_bool = "deny"
too_many_arguments = "deny"
too_many_lines = "warn"
